<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'">
  <title>HiddenAgent</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="titlebar">
    <button id="protecao" class="badge" title="Alterna a proteção contra captura de tela"></button>
    <input id="opacidade" type="range" min="0.3" max="1" step="0.05" title="Opacidade">
    <button id="minimizar" class="win-btn" title="Minimizar">&#8211;</button>
    <button id="fechar" class="win-btn close" title="Fechar">&#10005;</button>
  </header>

  <nav class="tabs">
    <button class="tab active" data-aba="notas">Notas</button>
    <button class="tab" data-aba="assistente">Assistente</button>
  </nav>

  <section id="aba-notas" class="painel">
    <textarea id="notas" spellcheck="false" placeholder="Suas notas aqui…" autofocus></textarea>
  </section>

  <section id="aba-assistente" class="painel" hidden>
    <div id="chave-setup" class="setup" hidden>
      <p id="chave-texto"></p>
      <div class="linha">
        <input id="chave-input" type="password" autocomplete="off" spellcheck="false">
        <button id="chave-salvar" class="botao">Salvar</button>
      </div>
      <p id="chave-erro" class="erro" hidden></p>
      <p id="chave-dica" class="dica"></p>
    </div>

    <div id="chat" class="chat"></div>

    <div class="chips">
      <button id="capturar" class="botao" title="Ctrl+Alt+P: captura o monitor do mouse e envia à IA. O último print permanece como contexto até Limpar.">Print + IA</button>
      <button class="chip" data-prompt="Resuma as minhas notas em poucos tópicos.">Resumir</button>
      <button class="chip" data-prompt="Liste os itens de ação (com responsável e prazo, se houver) que aparecem nas minhas notas.">Itens de ação</button>
      <button class="chip" data-prompt="Sugira 5 ideias ou próximos passos com base nas minhas notas.">Ideias</button>
    </div>

    <form id="form" class="entrada">
      <textarea id="pergunta" rows="2" placeholder="Pergunte algo… (Enter envia, Shift+Enter quebra linha)"></textarea>
      <button id="enviar" class="botao" type="submit">Enviar</button>
    </form>

    <div class="seletores">
      <select id="provedor" title="Provedor de IA"></select>
      <select id="modelo" title="Modelo"></select>
    </div>

    <div class="rodape-chat">
      <label title="As notas são enviadas ao provedor de IA selecionado junto com a pergunta">
        <input id="usar-notas" type="checkbox" checked> Usar notas como contexto
      </label>
      <span class="espaco"></span>
      <button id="limpar" class="link">Limpar</button>
      <button id="trocar-chave" class="link">Chave</button>
    </div>
  </section>

  <footer>Ctrl+Alt+H mostra/oculta · Ctrl+Alt+P print + IA</footer>

  <script src="renderer.js"></script>
</body>
</html>
